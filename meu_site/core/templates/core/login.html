<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Seguro</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f9; margin: 0; }
        .login-box { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .error { color: #d9534f; background: #fdf7f7; padding: 10px; border-radius: 5px; margin-bottom: 15px; font-size: 14px; border: 1px solid #f5c6cb; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #333; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 10px; transition: background 0.3s; }
        button:hover { background: #555; }
        .links-container { text-align: center; margin-top: 20px; }
        .links-container a { text-decoration: none; font-size: 14px; display: block; margin-bottom: 10px; transition: opacity 0.3s; }
        .links-container a:hover { opacity: 0.7; }
        .link-reset { color: #e74c3c; }
        .link-create { color: #2ecc71; }
        hr { margin: 20px 0; border: 0; border-top: 1px solid #eee; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2 style="text-align: center; color: #333; margin-top: 0;">Autenticação</h2>

        {% if messages %}
            <div class="error">
                {% for message in messages %}
                    {{ message }}<br>
                {% endfor %}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            
            <label for="id_username" style="color: #555; font-size: 14px; font-weight: bold;">Usuário:</label>
            {{ form.username }}
            
            <label for="id_password" style="color: #555; font-size: 14px; font-weight: bold; display: block; margin-top: 10px;">Senha:</label>
            {{ form.password }}
            
            <button type="submit">Entrar no Sistema</button>
        </form>

        <hr>

        <div class="links-container">
            <a href="{% url 'password_reset' %}" class="link-reset">
                🔒 Esqueci minha senha
            </a>
            
            <a href="{% url 'criar_usuario' %}" class="link-create">
                ➕ Criar uma nova conta
            </a>
        </div>
    </div>

</body>
</html>
