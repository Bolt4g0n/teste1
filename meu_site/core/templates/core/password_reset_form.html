<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Senha | Sistema Seguro</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 50px;">
    <div style="max-width: 400px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
        <h2 style="color: #2c3e50;">Esqueceu a senha?</h2>
        <p style="color: #666; font-size: 14px;">Digite seu e-mail abaixo. Enviaremos um link seguro e temporário para você redefinir sua senha.</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" style="width: 100%; padding: 10px; background-color: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer;">Enviar link seguro</button>
        </form>
        <hr style="margin: 20px 0; border: 1px solid #eee;">
        <a href="{% url 'tela_login' %}" style="display: block; text-align: center; color: #7f8c8d; text-decoration: none;">Voltar para o Login</a>
    </div>
</body>
</html>
