<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Teste de Segurança - Criptografia</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f7f6; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 600px; margin: auto; }
        h2 { color: #2c3e50; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px; }
        .dado { background: #eef2f3; padding: 12px; border-left: 5px solid #3498db; font-family: monospace; word-break: break-all; border-radius: 4px; }
        .sucesso { color: #27ae60; font-weight: bold; margin-top: 20px; }
        .chave { border-left-color: #27ae60; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Visualizador de Criptografia Simétrica (AES)</h2>
        
        <p><strong>Texto Original (Plaintext):</strong></p>
        <p class="dado">{{ texto_original }}</p>
        
        <p><strong>Texto Cifrado (Ciphertext - Base64):</strong></p>
        <p class="dado">{{ dado_criptografado }}</p>
        
        <p class="sucesso">✓ Descriptografia Realizada com Sucesso:</p>
        <p class="dado chave">{{ dado_revelado }}</p>
    </div>
</body>
</html>
